name: EmonOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: ShellCheck EmonOS scripts
        run: |
          find buildroot-external -type f \( -name '*.sh' -o -path '*/usr/libexec/*' \) \
            -print0 | xargs -0r shellcheck

      - name: Validate Compose definition
        run: docker compose -f buildroot-external/app/docker-compose.yml config --quiet

      - name: Compile Python test harness
        run: python3 -m py_compile tests/*.py

      - name: Check whitespace
        # checkout uses a shallow single-commit clone by default, so HEAD^ is
        # intentionally unavailable. git show checks this commit directly.
        run: git show --check --format= HEAD

  build-and-test-x86:
    name: Build and test x86-64 VM
    needs: lint
    runs-on: ubuntu-latest
    # A clean Buildroot toolchain + EDK2 + Go/Docker build took more than 75
    # minutes on the standard GitHub runner. Keep the test bounded, but allow
    # the cold build to finish before judging performance/cost.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache Buildroot downloads
        uses: actions/cache@v6
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles('buildroot-external/**', 'Makefile') }}
          restore-keys: buildroot-dl-${{ runner.os }}-

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential cpio flex file g++ gcc git libncurses-dev \
            mtools qemu-system-x86 ovmf rsync strace unzip wget

      - name: Install Python test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Reclaim unused SDK space and check disk budget
        run: |
          df -h .
          # This is an ephemeral GitHub-hosted runner. None of these SDKs are
          # needed for Buildroot; keep setup-python's toolcache intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h .
          # Local clean Buildroot output is ~28 GiB. Fail before an expensive
          # build if the runner image no longer leaves enough headroom.
          available=$(df --output=avail -B1 . | tail -1)
          if test "$available" -lt $((32 * 1024 * 1024 * 1024)); then
            echo 'EmonOS requires at least 32 GiB free for a clean Buildroot build.' >&2
            exit 1
          fi

      - name: Build x86-64 VM image
        run: make emonos_x86_64_vm

      - name: Test x86-64 VM under TCG
        env:
          # GitHub-hosted runners do not expose /dev/kvm. The normal local
          # default remains KVM; CI uses portable software emulation.
          EMONOS_QEMU_CPU: max
          EMONOS_QEMU_EXTRA_ARGS: -accel tcg,thread=multi -snapshot
          EMONOS_QEMU_DISABLE_IO_URING: '1'
          EMONOS_QEMU_MIN_AVAILABLE_MB: '4096'
        run: tests/run.sh x86-64-vm -q

      - name: Record build evidence
        if: always()
        run: |
          mkdir -p ci-artifacts
          if test -f output/x86-64-vm/images/emonos-x86-64-vm.img; then
            sha256sum output/x86-64-vm/images/emonos-x86-64-vm.img > ci-artifacts/image.sha256
            sfdisk -d output/x86-64-vm/images/emonos-x86-64-vm.img > ci-artifacts/partitions.sfdisk
          fi
          if test -f output/x86-64-vm/.config; then
            cp output/x86-64-vm/.config ci-artifacts/buildroot.config
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x86-64-vm-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
