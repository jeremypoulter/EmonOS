name: EmonOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_images:
        description: Upload the raw ~7 GiB target disk images as artifacts (opt-in)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check GitHub workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: '1.7.12'

      - name: ShellCheck EmonOS scripts
        run: |
          find buildroot-external ci tests -type f \( -name '*.sh' -o -path '*/usr/libexec/*' \) \
            -print0 | xargs -0r shellcheck

      - name: Validate Compose definition
        run: docker compose -f buildroot-external/app/docker-compose.yml config --quiet

      - name: Validate data-image host tool selections
        run: |
          for target in emonos_x86_64_vm emonos_rpi4; do
            grep -qx 'BR2_PACKAGE_HOST_E2FSPROGS=y' \
              "buildroot-external/configs/${target}_defconfig"
          done

      - name: Compile Python test harness
        run: python3 -m py_compile tests/*.py buildroot-external/app/*.py

      - name: Validate generated requirement coverage
        run: python3 tests/requirement_coverage.py --check

      - name: Reject developer-specific build paths
        run: |
          pattern='open''code|CLAUDE''_JOB_DIR'
          if git grep -inE "$pattern" -- .github ci tests buildroot-external Makefile; then
            echo 'Build and test paths must not depend on a developer harness.' >&2
            exit 1
          fi

      - name: Check whitespace
        # checkout uses a shallow single-commit clone by default, so HEAD^ is
        # intentionally unavailable. git show checks this commit directly.
        run: git show --check --format= HEAD

  build:
    name: Build ${{ matrix.target }}${{ matrix.test && ' and test' || '' }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Exactly the two supported targets, each on its own hosted runner.
      max-parallel: 2
      matrix:
        include:
          - target: x86-64-vm
            make_target: emonos_x86_64_vm
            test: true
          - target: rpi4
            make_target: emonos_rpi4
            test: false
    # A cold Buildroot build took about 94 minutes on a standard hosted runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check disk space for the Buildroot build
        run: |
          # This is an ephemeral GitHub-hosted runner. None of these SDKs are
          # needed for Buildroot; keep setup-python's toolcache intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h . "$RUNNER_TEMP" /var/lib/docker
          # One target's output is about 28 GiB; the builder image, download
          # cache and ccache add several GiB more. Fail before any build work.
          required=$((40 * 1024 * 1024 * 1024))
          available=$(df --output=avail -B1 . | tail -1)
          if test "$available" -lt "$required"; then
            echo "EmonOS needs at least 40 GiB free for a clean ${{ matrix.target }} build;" \
              "only $((available / 1024 / 1024 / 1024)) GiB is available." >&2
            exit 1
          fi

      - name: Derive Buildroot cache keys
        id: keys
        run: |
          echo "buildroot=$(git -C buildroot rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CACHE_ROOT=$RUNNER_TEMP/emonos-cache" >> "$GITHUB_ENV"

      - name: Cache Buildroot downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emonos-cache/dl
          key: buildroot-dl-${{ runner.os }}-${{ steps.keys.outputs.buildroot }}

      - name: Cache ${{ matrix.target }} compiler objects
        id: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emonos-cache/ccache/${{ matrix.target }}
          key: ccache-${{ runner.os }}-${{ matrix.target }}-${{ steps.keys.outputs.buildroot }}-${{ hashFiles(format('buildroot-external/configs/{0}_defconfig', matrix.make_target), 'buildroot-external/board/**', 'ci/builder/Dockerfile', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.target }}-${{ steps.keys.outputs.buildroot }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build pinned host builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci/builder
          load: true
          tags: emonos-builder:ci
          # Separate GHA cache scopes keep the two target jobs from writing the
          # same cache entries concurrently.
          cache-from: type=gha,scope=builder-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.target }}

      - name: Set up Python
        if: matrix.test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Install QEMU test dependencies
        if: matrix.test
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 ovmf jq strace
          python -m pip install --requirement tests/requirements.txt

      - name: Test QEMU launcher on a clean runner
        if: matrix.test
        run: python -m pytest -q tests/test_qemu_launcher.py tests/test_docker_archive.py tests/test_ota_scripts.py tests/test_health.py

      - name: Create ephemeral PoC signing credentials
        run: make rauc_dev_keys

      - name: Build ${{ matrix.target }} image
        env:
          EMONOS_CCACHE_MAXSIZE: 3G
        run: |
          ci/builder/run.sh emonos-builder:ci \
            "$CACHE_ROOT/dl" "$CACHE_ROOT/ccache/${{ matrix.target }}" \
            make ${{ matrix.make_target }}

      - name: Verify deterministic image assembly
        env:
          EMONOS_CCACHE_MAXSIZE: 3G
        run: |
          image='output/${{ matrix.target }}/images/emonos-${{ matrix.target }}.img'
          before=$(sha256sum "$image" | cut -d' ' -f1)
          ci/builder/run.sh emonos-builder:ci \
            "$CACHE_ROOT/dl" "$CACHE_ROOT/ccache/${{ matrix.target }}" \
            make ${{ matrix.make_target }}
          after=$(sha256sum "$image" | cut -d' ' -f1)
          printf 'initial=%s\nrebuilt=%s\n' "$before" "$after" > image-reproducibility.txt
          test "$before" = "$after"

      - name: Record ccache statistics
        if: always()
        run: |
          {
            echo '### ccache: ${{ matrix.target }}'
            echo '```'
            ci/builder/run.sh emonos-builder:ci \
              "$CACHE_ROOT/dl" "$CACHE_ROOT/ccache/${{ matrix.target }}" \
              output/${{ matrix.target }}/host/bin/ccache --show-stats || echo 'ccache statistics unavailable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test x86-64 VM under TCG
        if: matrix.test
        env:
          # GitHub-hosted runners do not expose /dev/kvm. The normal local
          # default remains KVM; CI uses portable software emulation.
          EMONOS_QEMU_CPU: max
          EMONOS_QEMU_EXTRA_ARGS: -accel tcg,thread=multi
          EMONOS_QEMU_DISABLE_IO_URING: '1'
          EMONOS_QEMU_MIN_AVAILABLE_MB: '4096'
          # The launcher boots every test from a temporary qcow2 overlay, so the
          # source image is never written.
          EMONOS_QEMU_RAUC_BUNDLE: ${{ github.workspace }}/output/x86-64-vm/images/emonos-x86-64-vm.raucb
          EMONOS_RUN_REBOOT_TEST: '1'
        run: tests/run.sh x86-64-vm -q

      - name: Record build evidence
        if: always()
        run: |
          mkdir -p ci-artifacts
          image='output/${{ matrix.target }}/images/emonos-${{ matrix.target }}.img'
          if test -f "$image"; then
            sha256sum "$image" > ci-artifacts/image.sha256
            sfdisk -d "$image" > ci-artifacts/partitions.sfdisk
          fi
          if test -f 'output/${{ matrix.target }}/.config'; then
            cp 'output/${{ matrix.target }}/.config' ci-artifacts/buildroot.config
          fi
          if test -f image-reproducibility.txt; then
            cp image-reproducibility.txt ci-artifacts/image-reproducibility.txt
          fi
          if test -d 'output/test-results/${{ matrix.target }}'; then
            mkdir -p ci-artifacts/test-results
            cp -a 'output/test-results/${{ matrix.target }}/.' ci-artifacts/test-results/
          fi
          bundle='output/${{ matrix.target }}/images/emonos-${{ matrix.target }}.raucb'
          if test -f "$bundle"; then
            sha256sum "$bundle" > ci-artifacts/bundle.sha256
            'output/${{ matrix.target }}/host/bin/rauc' \
              --keyring='output/${{ matrix.target }}/target/etc/rauc/keyring.pem' \
              info --output-format=json "$bundle" > ci-artifacts/bundle-info.json
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw disk image (opt-in)
        if: inputs.upload_images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-image-${{ github.sha }}
          path: output/${{ matrix.target }}/images/emonos-${{ matrix.target }}.img
          if-no-files-found: error
          retention-days: 3
