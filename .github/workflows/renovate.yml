name: Renovate

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what Renovate would do without opening PRs
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Preflight - GitHub App credentials
        env:
          RENOVATE_APP_ID: ${{ vars.RENOVATE_APP_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RENOVATE_APP_ID" ] || [ -z "$RENOVATE_APP_PRIVATE_KEY" ]; then
            echo "::error::Set the RENOVATE_APP_ID variable and RENOVATE_APP_PRIVATE_KEY secret (GitHub App with contents, pull requests, issues, workflows: read/write)."
            exit 1
          fi

      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1.11.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Validate Renovate configuration
        run: npx --yes --package renovate@39 -- renovate-config-validator .github/renovate-global.json renovate.json

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-global.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
