# Debian packages in, a plain root directory out. Partitioning, slot images
# and bundles stay with the shared EmonOS scripts (see build.sh).
# Adapted from ramcq's mkosi proof of concept.
[Distribution]
Distribution=debian
Release=trixie
# build.sh overrides this with --mirror to pin snapshot.debian.org.

[Output]
Format=directory
Output=rootfs

[Content]
Bootable=no
WithDocs=no
CleanPackageMetadata=yes
Hostname=emonos
# mkosi does not install Recommends, so list everything that is used.
# Docker comes from Docker's own apt repository (see build.sh).
Packages=
        systemd
        systemd-sysv
        systemd-repart
        systemd-resolved
        login
        udev
        dbus
        kmod
        initramfs-tools
        iproute2
        docker-ce
        docker-ce-cli
        docker-compose-plugin
        containerd.io
        rauc
        rauc-service
        openssh-server
        jq
        curl
        ca-certificates
        e2fsprogs
        grub-common
        linux-image-amd64
